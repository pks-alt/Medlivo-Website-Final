name: Check published Search Jobs
on:
  push:
    branches: [enhancement/search-jobs-results-first]
    paths: [.github/workflows/check-published-jobs.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5bf9e348cec9b1099e88aab113a9f2f57b64ce08
      - name: Install existing browser tools
        run: python -m pip install -r requirements-dev.txt
      - name: Verify actual public page files and all page routes
        run: python scripts/verify_site.py --base-url https://pks-alt.github.io/Medlivo-Website-Final/ --public --output-dir verification/public
      - name: Verify seventeen public Search Jobs widths and filter routes
        run: python scripts/verify_jobs_layout.py --base-url https://pks-alt.github.io/Medlivo-Website-Final/ --public --output-dir verification/jobs-public
      - name: Preserve public screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-public-verification
          path: verification/
          retention-days: 14
