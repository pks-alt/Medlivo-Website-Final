name: Verify light Request Staff page
on:
  push:
    branches: [enhancement/request-staff-light-final]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhancement/request-staff-light-final
      - name: Install tools
        run: python -m pip install -r requirements-dev.txt
      - name: Refresh manifest
        run: python scripts/update_manifest.py --build-id medlivo-request-staff-light-final
      - name: Browser checks
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/medlivo-http.log 2>&1 &
          python scripts/verify_site.py --base-url http://127.0.0.1:8765/ --output-dir verification/site
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          from playwright.sync_api import sync_playwright
          out=Path('verification/request');out.mkdir(parents=True,exist_ok=True)
          widths=[320,390,540,768,1024,1440,1920,2560,3440]
          rows=[]
          with sync_playwright() as pw:
              exe=shutil.which('google-chrome') or shutil.which('chromium')
              browser=pw.chromium.launch(headless=True,args=['--no-sandbox'],**({'executable_path':exe} if exe else {}))
              for w in widths:
                  p=browser.new_page(viewport={'width':w,'height':900 if w<1040 else 1080})
                  errors=[];p.on('pageerror',lambda e,b=errors:b.append(str(e)))
                  r=p.goto('http://127.0.0.1:8765/request-staff.html?division=Rehabilitation',wait_until='networkidle')
                  d=p.evaluate("""()=>({
                    overflow:document.documentElement.scrollWidth>innerWidth,
                    blueHero:!!document.querySelector('.hero'),
                    stageBg:getComputedStyle(document.querySelector('.request-stage')).backgroundColor,
                    h1:document.querySelector('h1').innerText,
                    division:document.querySelector('#division').value,
                    formTop:document.querySelector('.form').getBoundingClientRect().top,
                    copyTop:document.querySelector('.request-copy').getBoundingClientRect().top,
                    clipped:[...document.querySelectorAll('main h1,main h2,main p,main label,main button,main a')].filter(e=>e.scrollWidth>e.clientWidth+2).map(e=>e.innerText.trim())
                  })""")
                  assert r.status==200 and not d['overflow'] and not d['clipped'] and not d['blueHero']
                  assert d['division']=='Rehabilitation' and d['h1']=='Tell us where you need coverage.'
                  if w<=720: assert d['formTop']<d['copyTop']
                  if w in [390,1920]:
                      p.screenshot(path=str(out/f'request-{w}-full.png'),full_page=True)
                      p.locator('.request-grid').screenshot(path=str(out/f'request-{w}-stage.png'))
                  rows.append({'width':w,**d,'errors':errors})
                  p.close()
              browser.close()
          (out/'layout.json').write_text(json.dumps(rows,indent=2))
          PY
      - name: Commit refreshed manifest
        run: |
          git config user.name pks-alt
          git config user.email pk.s@medlivo.com
          git add BUILD.json
          git diff --cached --quiet || git commit -m "Refresh manifest for light Request Staff page"
          git push origin HEAD:enhancement/request-staff-light-final
      - uses: actions/upload-artifact@v4
        with:
          name: request-light-review
          path: verification/
          retention-days: 14
