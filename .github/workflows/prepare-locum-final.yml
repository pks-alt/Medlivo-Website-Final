name: Prepare finalized Locum page
on:
  push:
    branches: [enhancement/locum-final-page-20260928]
    paths: [.github/workflows/prepare-locum-final.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhancement/locum-final-page-20260928
      - name: Install existing verification tools
        run: python -m pip install -r requirements-dev.txt
      - name: Assemble exact approved page and scoped route improvements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,hashlib,base64,zlib,urllib.request,subprocess
          from bs4 import BeautifulSoup
          repo=os.environ['GITHUB_REPOSITORY']
          assert repo=='pks-alt/Medlivo-Website-Final'
          baseline=json.loads(Path('BUILD.json').read_text());old=Path('locum-tenens.html').read_text()
          digest=lambda data:hashlib.sha256(data).hexdigest()
          assert digest(old.encode())==baseline['files']['locum-tenens.html']
          req=urllib.request.Request('https://pks-alt.github.io/Medlivo-Website-Final/locum-tenens.html',headers={'Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=40) as response: public=response.read()
          assert digest(public)==digest(old.encode()),'Published starting page differs from this branch'
          ids=['eb216c60a00b0e8c6a721ab06dde9c5400a81d7f','ca6343b80ef367b4c496daae277c3774ae4d5c6f','0d1c8e494ea6c1cc6dfc926eb08d0a43fb4d23e4']
          parts=[]
          for sha in ids:
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response:blob=json.load(response)
              assert blob['sha']==sha
              parts.append(base64.b64decode(blob['content']).decode())
          raw=zlib.decompress(base64.b64decode(''.join(parts)))
          assert digest(raw)=='93a9cd0cb9bfb6851ab1ba24739b01a1c080b8aa63a6acd6fd40f468c375bffb','Candidate transport mismatch'
          files=json.loads(raw)
          assert set(files)=={'locum-tenens.html','assets/css/locum-responsive.css','scripts/verify_locum_layout.py'}
          for name,content in files.items():
              path=Path(name);path.parent.mkdir(parents=True,exist_ok=True);path.write_text(content,encoding='utf-8')
          p=Path('assets/js/request-staff-1.js');js=p.read_text()
          prefill='''
          // Carry the division into the existing form. Ignore unrecognized query values.
          const requestParams = new URLSearchParams(window.location.search);
          const requestedDivision = requestParams.get('division');
          const divisionInput = form.querySelector('[name="division"]');
          if (requestedDivision && [...divisionInput.options].some(option => option.value === requestedDivision)) {
            divisionInput.value = requestedDivision;
          }
          '''
          needle="const status=document.querySelector('#formStatus');"
          assert js.count(needle)==1
          p.write_text(js.replace(needle,needle+prefill))
          p=Path('assets/js/search-jobs-3.js');js=p.read_text()
          needle='{value:"Physician Assistant",label:"Physician Assistant (PA)",specialties:["Primary Care","Urgent Care","Emergency Medicine","Hospitalist","Cardiology","Surgery","Orthopedics"]}'
          replacement=needle+''',
                {value:"Nurse Practitioner / Physician Assistant",label:"Nurse Practitioner / Physician Assistant (NP / PA)",specialties:["Primary Care","Urgent Care","Emergency Medicine","Hospitalist","Cardiology","OB/GYN","Psychiatry","Pediatrics","Surgery","Orthopedics"]},
                {value:"CRNA",label:"Certified Registered Nurse Anesthetist (CRNA)",specialties:["Anesthesia"]}'''
          assert js.count(needle)==1;js=js.replace(needle,replacement)
          js=js.replace('contextText:"Search physician, nurse practitioner, and physician assistant opportunities."','contextText:"Search physician, nurse practitioner, physician assistant and CRNA opportunities."')
          needle='''    const target=norm(filter);
              if(norm(job.profession)===target)return true;'''
          replacement='''    const target=norm(filter);
              // A physician assistant is not a physician. Keep provider routes distinct.
              if(target==="physician" && /physician assistant|nurse practitioner|crna|nurse anesthetist/.test(norm(job.profession)))return false;
              if(target==="nurse practitioner physician assistant")return professionMatch(job,"Nurse Practitioner")||professionMatch(job,"Physician Assistant");
              if(norm(job.profession)===target)return true;'''
          assert js.count(needle)==1;js=js.replace(needle,replacement)
          js=js.replace('"physician assistant":["physician assistant"," pa "]','"physician assistant":["physician assistant"," pa "],\n      "crna":["crna","nurse anesthetist"]')
          p.write_text(js)
          for filename,asset in [('request-staff.html','request-staff-1.js'),('search-jobs.html','search-jobs-3.js')]:
              p=Path(filename);text=p.read_text();needle='src="assets/js/'+asset+'"';assert text.count(needle)==1;p.write_text(text.replace(needle,'src="assets/js/'+asset+'?v=20260928-locum"'))
          changed={'locum-tenens.html','assets/js/request-staff-1.js','assets/js/search-jobs-3.js','request-staff.html','search-jobs.html'}
          for name,expected in baseline['files'].items():
              if name not in changed:assert digest(Path(name).read_bytes())==expected,'Unexpected change: '+name
          assert str(BeautifulSoup(old,'html.parser').footer)==str(BeautifulSoup(files['locum-tenens.html'],'html.parser').footer),'Footer markup changed'
          subprocess.run(['python','scripts/update_manifest.py','--build-id','medlivo-locum-final-20260928'],check=True)
          out=Path('verification/locum-prep');out.mkdir(parents=True,exist_ok=True)
          report={'source_commit':'8d60a48856d2c5d8e52b49425c27dfc72888c223','candidate_sha256':digest(raw),'other_division_pages_and_all_image_bytes_unchanged':True,'approved_models':['Per Diem Coverage','Travel Locum Assignments','Permanent / Full-Time Hiring'],'permanent_model':'direct hire by healthcare organization','new_job_records':0,'main_words':len(BeautifulSoup(files['locum-tenens.html'],'html.parser').main.get_text(' ',strip=True).split()),'candidate_files':{k:digest(v.encode()) for k,v in files.items()}}
          (out/'scope.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          PY
      - name: Test all pages and fifteen Locum screen sizes
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/medlivo-locum-http.log 2>&1 &
          python scripts/verify_site.py --base-url http://127.0.0.1:8765/ --output-dir verification/locum-prep/all
          python scripts/verify_locum_layout.py --base-url http://127.0.0.1:8765/ --output-dir verification/locum-prep/locum
      - name: Save tested source on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-locum-final.yml
          git add locum-tenens.html assets/css/locum-responsive.css scripts/verify_locum_layout.py assets/js/request-staff-1.js assets/js/search-jobs-3.js request-staff.html search-jobs.html BUILD.json
          git commit -m 'Finalize Locum services and consistent division design with scoped provider routes'
          git push origin HEAD:enhancement/locum-final-page-20260928
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locum-final-review
          path: verification/locum-prep/
          retention-days: 14
