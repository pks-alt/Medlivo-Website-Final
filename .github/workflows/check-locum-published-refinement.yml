name: Check published Locum refinement
on:
  push:
    branches: [enhancement/locum-reference-refinement-final]
    paths: [.github/workflows/check-locum-published-refinement.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ce8d3a5a6086e05252688b5177895d382d6a8cab
      - name: Install existing browser tools
        run: python -m pip install -r requirements-dev.txt
      - name: Verify actual public files and fifteen viewport sizes
        run: python scripts/verify_locum_layout.py --base-url https://pks-alt.github.io/Medlivo-Website-Final/ --public --output-dir verification/locum-public
      - name: Preserve public screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locum-published-refinement
          path: verification/locum-public/
          retention-days: 14
