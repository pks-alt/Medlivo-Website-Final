name: Verify compact Nursing care settings
on:
  push:
    branches: [enhancement/nursing-care-settings-spacing-20260928]
    paths: [.github/workflows/prepare-nursing-spacing.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install existing verification tools
        run: python -m pip install -r requirements-dev.txt
      - name: Apply the tested section-only spacing changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re,subprocess,sys
          from bs4 import BeautifulSoup
          root=Path('.'); manifest=json.loads(Path('BUILD.json').read_text())
          assert manifest['repository']=='pks-alt/Medlivo-Website-Final'
          for name,sha in manifest['files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha,name
          css=Path('assets/css/nursing-responsive.css');s=css.read_text()
          changes={
          '.nursing-division main>.nd-settings{background:#f5f8f8;color:var(--nd-body)}':'.nursing-division main>.nd-settings{background:#f5f8f8;color:var(--nd-body);padding:clamp(36px,3vw,48px) 0}',
          '.nd-settings .nd-eyebrow{color:#235466}':'.nd-settings .nd-eyebrow{color:#235466;margin-bottom:9px}',
          '.nursing-division .nd-settings h2{color:var(--nd-ink);max-width:26ch}':'.nursing-division .nd-settings h2{color:var(--nd-ink);max-width:28ch;font-size:clamp(30px,2.1vw,40px);line-height:1.16}\n.nd-settings .nd-section-head{gap:14px clamp(28px,4vw,64px);margin-bottom:22px;align-items:center}',
          '.nd-setting-row{display:grid;grid-template-columns:46px minmax(0,1.3fr) minmax(0,.85fr);gap:28px;padding:30px 0;border-bottom:1px solid #b7cac6;align-items:start}':'.nd-setting-row{display:grid;grid-template-columns:36px minmax(0,1.35fr) minmax(0,.85fr);gap:22px;padding:19px 0;border-bottom:1px solid #b7cac6;align-items:start}',
          'width:38px;height:38px;border-radius:10px;background:#d0dfdc':'width:32px;height:32px;border-radius:8px;background:#d0dfdc',
          '.nd-setting-copy h3{font-size:clamp(23px,1.6vw,28px);color:var(--nd-ink);max-width:36ch}':'.nd-setting-copy h3{font-size:clamp(22px,1.35vw,26px);color:var(--nd-ink);max-width:none}',
          '.nd-setting-copy>p{margin-top:10px;color:var(--nd-body);max-width:64ch}':'.nd-setting-copy>p{margin-top:6px;color:var(--nd-body);max-width:72ch}\n.nursing-division .nd-settings p{line-height:1.58}',
          '.nd-setting-factors{align-self:center;padding:2px 0 2px 30px;border-left:1px solid #b7cac6;min-width:0}':'.nd-setting-factors{align-self:center;padding:0 0 0 22px;border-left:1px solid #b7cac6;min-width:0}',
          '.nd-setting-factors h4{margin:0 0 8px;color:#235466;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}':'.nd-setting-factors h4{margin:0 0 4px;color:#235466;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}',
          '.nursing-division .nd-setting-factors p{font-size:16px;color:var(--nd-body);font-weight:500;line-height:1.8}':'.nursing-division .nd-setting-factors p{font-size:16px;color:var(--nd-body);font-weight:500;line-height:1.58}',
          '.nd-setting-row{gap:20px;grid-template-columns:40px minmax(0,1.25fr) minmax(0,.8fr)}':'.nd-setting-row{gap:18px;grid-template-columns:32px minmax(0,1.35fr) minmax(0,.8fr)}',
          '.nd-setting-factors{padding-left:20px}':'.nd-setting-factors{padding-left:18px}',
          '.nd-setting-row{grid-template-columns:38px minmax(0,1fr);gap:12px 18px;padding:24px 0}.nd-setting-factors{grid-column:2;padding:0;border:0}.nd-setting-factors h4{margin-bottom:3px}':'.nd-setting-row{grid-template-columns:32px minmax(0,1fr);gap:8px 12px;padding:18px 0}.nd-setting-copy{display:contents}.nd-setting-copy h3{grid-column:2;align-self:center}.nd-setting-copy>p{grid-column:1/-1;margin-top:0;max-width:none}.nd-setting-factors{grid-column:1/-1;padding:0;border:0;display:block}.nd-setting-factors h4{display:inline;margin:0 8px 0 0;letter-spacing:.03em}.nd-setting-factors p{display:inline}.nd-settings .nd-section-head{margin-bottom:18px}',
          '.nd-setting-row{grid-template-columns:32px minmax(0,1fr);column-gap:14px}':'.nd-setting-row{grid-template-columns:32px minmax(0,1fr);column-gap:12px}',
          }
          for old,new in changes.items():
              assert s.count(old)==1,'Unexpected source rule: '+old
              s=s.replace(old,new)
          css.write_text(s)
          assert hashlib.sha256(css.read_bytes()).hexdigest()=='0152fc5dc527fc873094d65195923bf341db344796f4b4683bc549584da16ab8'
          html=Path('nursing-allied.html');s=html.read_text();before=BeautifulSoup(s,'html.parser').body.decode()
          s,n=re.subn(r'assets/css/nursing-responsive\.css\?v=[^\"]+', 'assets/css/nursing-responsive.css?v=20260928-settings-compact',s)
          assert n==1 and BeautifulSoup(s,'html.parser').body.decode()==before
          html.write_text(s)
          assert hashlib.sha256(html.read_bytes()).hexdigest()=='c31ea2985642e09f0df18c46a307fafdbd95a5baa4abf3488a33f117642be848'
          test=Path('scripts/verify_nursing_layout.py');s=test.read_text()
          old="care_settings:[...document.querySelectorAll('.nd-setting-copy h3')].map(e=>e.textContent.trim()),"
          new="care_settings_height:document.querySelector('#care-settings').getBoundingClientRect().height,\n                    "+old
          assert s.count(old)==1;s=s.replace(old,new)
          old="            if row['sections']!=SECTIONS or row['care_settings']!=SETTINGS:failures.append('Section order or four care settings changed')"
          new=old+"\n            if width>=1440 and row['care_settings_height']>810:failures.append('Care Settings desktop spacing expanded')\n            if width==390 and row['care_settings_height']>1320:failures.append('Care Settings mobile spacing expanded')"
          assert s.count(old)==1;s=s.replace(old,new);test.write_text(s)
          assert hashlib.sha256(test.read_bytes()).hexdigest()=='ffd0fe43a19743e8596974ed92e8006e7ddccfe99c94bee05a2fd91efca1a86b'
          subprocess.run([sys.executable,'scripts/update_manifest.py','--build-id','medlivo-nursing-settings-compact-20260928'],check=True)
          for name,sha in manifest['files'].items():
              if name not in ['nursing-allied.html','assets/css/nursing-responsive.css']:
                  assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha,'Out-of-scope change: '+name
          Path('verification').mkdir(exist_ok=True)
          Path('verification/scope.json').write_text(json.dumps({'all_page_body_html_unchanged':True,'all_four_settings_and_factors_preserved':True,'other_ten_pages_and_original_assets_unchanged':True,'body_font_sizes_unchanged':True,'css_sha256':hashlib.sha256(css.read_bytes()).hexdigest()},indent=2))
          PY
      - name: Test all pages plus Nursing layout and text contrast
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/medlivo-spacing.log 2>&1 &
          python scripts/verify_site.py --base-url http://127.0.0.1:8765/ --output-dir verification/all-pages
          python scripts/verify_nursing_layout.py --base-url http://127.0.0.1:8765/ --output-dir verification/nursing
      - name: Save only tested changes and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nursing-allied.html assets/css/nursing-responsive.css BUILD.json scripts/verify_nursing_layout.py
          git rm .github/workflows/prepare-nursing-spacing.yml
          git commit -m 'Reduce Nursing care-setting spacing while preserving every description and factor'
          git push origin HEAD:enhancement/nursing-care-settings-spacing-20260928
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nursing-spacing-review
          path: verification/
          retention-days: 14
