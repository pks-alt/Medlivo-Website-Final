name: Import final standalone website
on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap.yml, scripts/import_site.py, scripts/compare_design.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'pks-alt/Medlivo-Website-Final'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Read the pinned recovered source without changing it
        uses: actions/checkout@v4
        with:
          repository: pks-alt/Medlivo-Website
          ref: ec962a7bb7850cd6bfe7805664ca15a4261b508e
          path: _approved-source
          persist-credentials: false
      - name: Install verification tools
        run: python -m pip install beautifulsoup4==4.15.0 playwright==1.63.0 pillow==12.3.0
      - name: Create the independent page and asset files
        run: python scripts/import_site.py
      - name: Browser-test the standalone codebase
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/medlivo-http.log 2>&1 &
          python scripts/verify_site.py --base-url http://127.0.0.1:8765/ --output-dir verification
      - name: Confirm approved visual layouts are unchanged
        run: python scripts/compare_design.py
      - name: Save the complete independent codebase
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html workforce-solutions.html nursing-allied.html rehabilitation.html request-staff.html locum-tenens.html search-jobs.html about.html leadership.html careers.html specialties.html assets BUILD.json .nojekyll .gitignore
          git commit -m 'Import final standalone Medlivo pages and assets with verified design preservation'
          git push origin HEAD:main
      - name: Save browser and comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build-verification
          path: verification/
          retention-days: 14
