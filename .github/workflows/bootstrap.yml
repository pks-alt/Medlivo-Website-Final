name: Import final standalone website
on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'pks-alt/Medlivo-Website-Final'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Read the pinned recovered source without changing it
        uses: actions/checkout@v4
        with:
          repository: pks-alt/Medlivo-Website
          ref: ec962a7bb7850cd6bfe7805664ca15a4261b508e
          path: _approved-source
          persist-credentials: false
      - name: Install verification tools
        run: python -m pip install beautifulsoup4 playwright pillow
      - name: Create a standalone project, not a copy of the old repository
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,re,base64,shutil
          from bs4 import BeautifulSoup
          root=pathlib.Path('.');source=root/'_approved-source'
          original=json.loads((source/'BUILD.json').read_text())
          assert len(original['pages'])==11
          assert not (root/'BUILD.json').exists(),'Initial import already completed. Do not overwrite subsequent edits.'
          def digest(b):return hashlib.sha256(b).hexdigest()
          def write(name,data):
              p=root/name;p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(data.encode() if isinstance(data,str) else data)
          shutil.copytree(source/'assets',root/'assets',dirs_exist_ok=True)
          image_paths={digest(p.read_bytes()):p.as_posix() for p in (root/'assets').rglob('*') if p.is_file()}
          shared={};pages={};transformations=[]
          for name,provenance in original['pages'].items():
              raw=(source/name).read_bytes()
              assert digest(raw)==provenance['sha256'],'Unexpected source version: '+name
              text=raw.decode('utf-8');stem=pathlib.Path(name).stem
              visible_before=BeautifulSoup(text,'html.parser').get_text(' ',strip=True)
              assert '/Medlivo-Website/' not in text
              assert not re.search(r'<base\b',text,re.I)
              def local_image(match):
                  kind=match.group(1);data=base64.b64decode(match.group(2),validate=True);key=digest(data)
                  if key not in image_paths:
                      ext={'svg+xml':'svg','jpeg':'jpg'}.get(kind,kind)
                      path='assets/images/embedded/'+key[:20]+'.'+ext
                      write(path,data);image_paths[key]=path
                  return image_paths[key]
              text=re.sub(r'data:image/([a-zA-Z0-9+.-]+);base64,([A-Za-z0-9+/=]+)',local_image,text)
              style_number=[0]
              def extract_style(match):
                  style_number[0]+=1
                  css=match.group(1)
                  assert not re.search(r'url\(',css,re.I),'Review CSS relative URLs before extracting styles'
                  suffix='' if style_number[0]==1 else '-'+str(style_number[0])
                  path='assets/css/'+stem+suffix+'.css';write(path,css)
                  return '<link rel="stylesheet" href="'+path+'">'
              text=re.sub(r'<style\b[^>]*>(.*?)</style>',extract_style,text,flags=re.S|re.I)
              script_number=[0]
              def extract_script(match):
                  attrs=match.group(1);code=match.group(2)
                  if re.search(r'\bsrc\s*=|application/ld\+json|application/json',attrs,re.I):return match.group(0)
                  script_number[0]+=1
                  if 'const menu=document.querySelector' in code:filename='navigation-menu.js'
                  elif 'const navDropdowns=' in code:filename='navigation-dropdowns.js'
                  else:filename=stem+'-'+str(script_number[0])+'.js'
                  path='assets/js/'+filename
                  if path in shared:assert shared[path]==code,'Different shared script variants'
                  shared[path]=code;write(path,code)
                  return '<script src="'+path+'"></script>'
              text=re.sub(r'<script\b([^>]*)>(.*?)</script>',extract_script,text,flags=re.S|re.I)
              # Home already contains the same Specialties/Company menus but lacked their click handler.
              if name=='index.html' and 'assets/js/navigation-dropdowns.js' not in text:
                  text=text.replace('</body>','<script src="assets/js/navigation-dropdowns.js"></script>\n</body>')
              visible_after=BeautifulSoup(text,'html.parser').get_text(' ',strip=True)
              assert visible_before==visible_after,'Visible copy changed: '+name
              write(name,text)
              pages[name]={'source_page_sha256':provenance['sha256'],'original_revision':provenance['commit'],'original_path':provenance['path'],'selection':provenance['selection'],'sha256':digest(text.encode())}
          assert (root/'assets/js/navigation-dropdowns.js').is_file()
          # Keep only local assets actually referenced by the canonical pages or another local asset.
          used=set()
          pending=list(original['pages'])
          while pending:
              path=pending.pop()
              data=(root/path).read_bytes()
              if pathlib.Path(path).suffix not in ['.html','.css','.js','.svg','.json']:continue
              text=data.decode('utf-8')
              for asset in re.findall(r'assets/[A-Za-z0-9_./-]+\.(?:png|jpe?g|webp|svg|gif|css|js)',text):
                  assert (root/asset).is_file(),'Missing imported asset '+asset
                  if asset not in used:used.add(asset);pending.append(asset)
          for asset in (root/'assets').rglob('*'):
              if asset.is_file() and asset.as_posix() not in used:asset.unlink()
          for directory in sorted((root/'assets').rglob('*'),reverse=True):
              if directory.is_dir() and not any(directory.iterdir()):directory.rmdir()
          manifest={'build_id':'medlivo-final-20260928-01','repository':'pks-alt/Medlivo-Website-Final','source_policy':'One root version per page, all assets local. No runtime or ongoing build dependency on the old repository.','initial_import_commit':'ec962a7bb7850cd6bfe7805664ca15a4261b508e','transformations':['Moved inline page styles and scripts into local assets without changing their cascade or execution order.','Decoded embedded images to byte-identical local files.','Connected the existing homepage dropdown click handler. No visual redesign.'],'pages':pages,'files':{}}
          for p in sorted([root/n for n in pages]+[p for p in (root/'assets').rglob('*') if p.is_file()]):manifest['files'][p.as_posix()]=digest(p.read_bytes())
          write('BUILD.json',json.dumps(manifest,indent=2)+'\n')
          write('.nojekyll','')
          write('.gitignore','/_approved-source/\n/_site/\n/verification/\n__pycache__/\n')
          print(json.dumps({'pages':len(pages),'required_asset_files':len(used),'source_hashes':'all matched','visible_copy':'unchanged','old_preview_folders_copied':False},indent=2))
          PY
      - name: Browser-test the new project independently
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/medlivo-http.log 2>&1 &
          python scripts/verify_site.py --base-url http://127.0.0.1:8765/ --output-dir verification
      - name: Compare screenshots with the preserved design
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image,ImageChops
          import shutil,io,pathlib,json
          results=[]
          with sync_playwright() as p:
              exe=shutil.which('google-chrome') or shutil.which('chromium')
              b=p.chromium.launch(headless=True,args=['--no-sandbox'],**({'executable_path':exe} if exe else {}))
              for width in [1440,390]:
                  for name in ['index.html','workforce-solutions.html','nursing-allied.html','rehabilitation.html']:
                      screenshots=[]
                      for prefix in ['_approved-source/','']:
                          page=b.new_page(viewport={'width':width,'height':1000 if width==1440 else 844},device_scale_factor=1)
                          page.goto('http://127.0.0.1:8765/'+prefix+name,wait_until='networkidle')
                          screenshots.append(Image.open(io.BytesIO(page.screenshot(full_page=True))).convert('RGB'));page.close()
                      before,after=screenshots
                      same_size=before.size==after.size
                      bounds=ImageChops.difference(before,after).getbbox() if same_size else None
                      results.append({'page':name,'width':width,'same_dimensions':same_size,'pixel_identical':same_size and bounds is None})
              b.close()
          pathlib.Path('verification/design-comparison.json').write_text(json.dumps(results,indent=2));print(json.dumps(results,indent=2))
          assert all(x['pixel_identical'] for x in results),'The import changed an approved visual. Do not publish.'
          PY
      - name: Save the complete independent codebase to this repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html workforce-solutions.html nursing-allied.html rehabilitation.html request-staff.html locum-tenens.html search-jobs.html about.html leadership.html careers.html specialties.html assets BUILD.json .nojekyll .gitignore
          git commit -m 'Import final standalone Medlivo pages and assets with verified design preservation'
          git push origin HEAD:main
      - name: Save browser evidence in this GitHub repository
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build-verification
          path: verification/
          retention-days: 14
