name: Verify compact Locum specialty directory
on:
  push:
    branches: [enhancement/locum-specialty-directory]
    paths: [.github/workflows/prepare-locum-directory.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhancement/locum-specialty-directory
      - name: Install existing verification tools
        run: python -m pip install -r requirements-dev.txt
      - name: Apply the reviewed specialty-only presentation
        run: |
          from_marker_unused=''
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re,subprocess
          from bs4 import BeautifulSoup
          assert 'Medlivo-Website-Final' in str(Path.cwd())
          baseline=json.loads(Path('BUILD.json').read_text())
          original=Path('locum-tenens.html').read_text()
          css=Path('assets/css/locum-responsive.css')
          marker='/* Compact specialty coverage within the provider section; no extra page section. */'
          text=css.read_text();assert text.count(marker)==1
          replacement='''/* Specialty directory: aligned names, no loose bullets or button-like pills. */
          .ld-specialty-band{display:block;margin-top:26px;padding:20px 24px 22px;background:#f7f9fb;border:1px solid #dce5ed;border-radius:10px;scroll-margin-top:108px}
          .locum-division .ld-specialty-band h3{color:var(--ld-ink);font-size:18px;line-height:1.45;font-weight:750;margin:0 0 14px;padding-left:12px;border-left:3px solid #21616b}
          .ld-specialty-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 26px;list-style:none;margin:0;padding:0;min-width:0}
          .ld-specialty-list li{position:static;min-width:0;max-width:100%;padding:0;color:var(--ld-body);font-size:16px;line-height:1.5;font-weight:500}
          .ld-specialty-list li::before{content:none}
          @media(max-width:1199px){.ld-specialty-list{grid-template-columns:repeat(3,minmax(0,1fr));column-gap:22px}}
          @media(max-width:820px){.ld-specialty-band{margin-top:24px;padding:18px 20px 20px}.ld-specialty-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px}}
          @media(max-width:540px){.ld-specialty-band{padding:19px 0 0;background:#fff;border:0;border-top:1px solid #dce5ed;border-radius:0}.locum-division .ld-specialty-band h3{margin-bottom:15px}.ld-specialty-list{gap:12px 18px}}
          '''
          css.write_text(text.split(marker)[0]+replacement)
          html,n=re.subn(r'(href="assets/css/locum-responsive\.css\?v=)[^"]+',r'\g<1>specialty-directory-20260928',original);assert n==1
          Path('locum-tenens.html').write_text(html)
          assert str(BeautifulSoup(original,'html.parser').body)==str(BeautifulSoup(html,'html.parser').body),'Content changed'
          p=Path('scripts/verify_locum_layout.py');s=p.read_text()
          s=s.replace('from playwright.sync_api import sync_playwright','from playwright.sync_api import sync_playwright, expect')
          needle='            contrast=page.evaluate(CONTRAST);'
          insert='''            directory=page.locator('.ld-specialty-band').evaluate("""e=>{const list=e.querySelector('ul'),s=getComputedStyle(list),r=e.getBoundingClientRect();return {columns:s.gridTemplateColumns.split(' ').length,height:r.height,items:[...list.children].map(x=>{const r=x.getBoundingClientRect(),s=getComputedStyle(x);return {text:x.textContent.trim(),left:r.left,right:r.right,top:r.top,bottom:r.bottom,font:parseFloat(s.fontSize),marker:getComputedStyle(x,'::before').content}})}}""")
                      row['specialty_directory']=directory
                      expected_columns=4 if width>1199 else 3 if width>820 else 2
                      assert directory['columns']==expected_columns,'Specialty column count'
                      assert all(x['font']>=16 and x['marker'] in ['none','normal'] for x in directory['items']),'Specialty font or marker'
                      assert directory['height']<=200 if width>=1440 else directory['height']<=330 if width<=540 else True,'Oversized specialty directory'
                      for i,a in enumerate(directory['items']):
                          for b in directory['items'][i+1:]:
                              assert min(a['right'],b['right'])<=max(a['left'],b['left'])+1 or min(a['bottom'],b['bottom'])<=max(a['top'],b['top'])+1,'Overlapping specialty names'
          '''
          assert s.count(needle)==1;s=s.replace(needle,insert+needle)
          needle="                    page.locator('#care-settings').screenshot(path=str(out/f'care-settings-{width}.png'),animations='disabled')"
          assert s.count(needle)==1
          s=s.replace(needle,needle+"\n                    page.locator('.ld-specialty-band').screenshot(path=str(out/f'specialties-{width}.png'),animations='disabled')")
          s=s.replace("assert page.locator('#searchDivision').input_value()=='Locum Tenens'","expect(page.locator('#searchDivision')).to_have_value('Locum Tenens')")
          s=s.replace("assert page.locator('#searchProfession').input_value()==PROFESSIONS[i]","expect(page.locator('#searchProfession')).to_have_value(PROFESSIONS[i])")
          p.write_text(s)
          expected={'locum-tenens.html':'3bcbcf8b957ba895240034c7d9060179bd11d34c59c788bfd2b33118df493f12','assets/css/locum-responsive.css':'69228d37054ce30b60759a98b2cfa5169f9e736d279b5e8bd0efede20962ea74','scripts/verify_locum_layout.py':'57a6f1add3425f233675b2eb9fbdde92ef37a68193db09b33eba4eae18294e57'}
          for name,sha in expected.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha,name+' differs from inspected source'
          for name,sha in baseline['files'].items():
              if name not in expected:assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha,name+' changed unexpectedly'
          subprocess.run(['python','scripts/update_manifest.py','--build-id','medlivo-locum-specialty-directory-20260928'],check=True)
          print('Exact reviewed source matched. All page content, links, images and other page files preserved.')
          PY
      - name: Check source, routes and fifteen browser widths
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/locum-directory-http.log 2>&1 &
          python scripts/verify_site.py --base-url http://127.0.0.1:8765/ --output-dir verification/all
          python scripts/verify_locum_layout.py --base-url http://127.0.0.1:8765/ --output-dir verification/locum
      - name: Save tested files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-locum-directory.yml
          git add locum-tenens.html assets/css/locum-responsive.css scripts/verify_locum_layout.py BUILD.json
          git commit -m 'Align Locum specialty names without changing approved page content'
          git push origin HEAD:enhancement/locum-specialty-directory
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locum-specialty-directory-review
          path: verification/
          retention-days: 14
