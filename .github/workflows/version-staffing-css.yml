name: Version the updated homepage stylesheet
on:
  push:
    branches: [main]
    paths: [.github/workflows/version-staffing-css.yml]
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Version only the stylesheet reference and refresh its manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('index.html');before=p.read_text()
          old='assets/css/home-responsive.css?v=20260928'
          assert before.count(old)==1
          assert 'id="staffing-support"' in before
          after=before.replace(old,'assets/css/home-responsive.css?v=fac59eb7')
          assert before.split('<body>',1)[1]==after.split('<body>',1)[1]
          p.write_text(after)
          subprocess.run(['python','scripts/update_manifest.py','--build-id','medlivo-final-staffing-cta-20260928'],check=True)
          PY
      - name: Commit the versioned homepage reference
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html BUILD.json
          git commit -m 'Version the refined staffing-panel stylesheet for returning visitors'
          git push origin HEAD:main
