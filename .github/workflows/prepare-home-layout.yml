name: Prepare homepage responsive enhancement
on:
  push:
    branches: [enhancement/home-large-screen-20260928]
    paths: [.github/workflows/prepare-home-layout.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install existing verification tools
        run: python -m pip install -r requirements-dev.txt
      - name: Apply the homepage-only layout layer and maintain checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          from bs4 import BeautifulSoup
          p=Path('index.html');before=p.read_text();manifest=json.loads(Path('BUILD.json').read_text())
          assert 'home-responsive.css' not in before
          assert 'Ready When You Are' not in BeautifulSoup(before,'html.parser').get_text()
          existing='<link rel="stylesheet" href="assets/css/index.css">'
          assert before.count(existing)==1
          after=before.replace(existing,existing+'\n<link rel="stylesheet" href="assets/css/home-responsive.css?v=20260928">')
          assert BeautifulSoup(before,'html.parser').get_text()==BeautifulSoup(after,'html.parser').get_text()
          p.write_text(after)
          css=Path('assets/css/home-responsive.css')
          css.write_text(css.read_text()+'\n/* Keep the compact header inside narrow phone viewports. */\n@media(max-width:359px){.nav .logo{width:116px}.nav{gap:8px}.actions{gap:6px}.actions .btn-green{font-size:11px;padding:0 9px}}\n')
          workflow=Path('.github/workflows/site.yml');text=workflow.read_text()
          local='          python scripts/verify_site.py --base-url http://127.0.0.1:8765/ --output-dir verification/local\n'
          assert text.count(local)==1
          text=text.replace(local,local+'          python scripts/verify_home_layout.py --base-url http://127.0.0.1:8765/ --output-dir verification/home-local\n')
          public='        run: python scripts/verify_site.py --base-url "$SITE_URL" --public --output-dir verification/public'
          assert text.count(public)==1
          text=text.replace(public,'        run: |\n          python scripts/verify_site.py --base-url "$SITE_URL" --public --output-dir verification/public\n          python scripts/verify_home_layout.py --base-url "$SITE_URL" --output-dir verification/home-public')
          workflow.write_text(text)
          for name,record in manifest['pages'].items():
              if name!='index.html':assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==record['sha256'],name+' changed unexpectedly'
          subprocess.run(['python','scripts/update_manifest.py','--build-id','medlivo-final-home-responsive-20260928'],check=True)
          Path('verification').mkdir(exist_ok=True)
          Path('verification/scope-check.json').write_text(json.dumps({'homepage_copy_unchanged':True,'homepage_order_unchanged':True,'other_ten_pages_unchanged':True,'image_bytes_unchanged':True,'before_home_sha256':hashlib.sha256(before.encode()).hexdigest()},indent=2))
          PY
      - name: Compare with the current published Final homepage
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import shutil,json,pathlib,hashlib,urllib.request
          out=pathlib.Path('verification');url='https://pks-alt.github.io/Medlivo-Website-Final/'
          data=urllib.request.urlopen(url,timeout=40).read()
          scope=json.loads((out/'scope-check.json').read_text())
          report={'url':url,'matched_starting_homepage':hashlib.sha256(data).hexdigest()==scope['before_home_sha256']}
          with sync_playwright() as p:
              exe=shutil.which('google-chrome') or shutil.which('chromium')
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'],**({'executable_path':exe} if exe else {}))
              for w,h in [(1920,1080),(2560,1440)]:
                  page=browser.new_page(viewport={'width':w,'height':h});page.goto(url,wait_until='networkidle');page.screenshot(path=str(out/('published-before-'+str(w)+'.png')),animations='disabled')
                  report[str(w)]=page.evaluate('({hero_height:document.querySelector(".home-hero-premium").getBoundingClientRect().height,content_width:document.querySelector(".hero-grid").getBoundingClientRect().width})');page.close()
              browser.close()
          (out/'published-before.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          assert report['matched_starting_homepage'],'The public homepage changed concurrently. Stop for review.'
          PY
      - name: Verify all pages and the large-screen homepage
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/home-layout-server.log 2>&1 &
          python scripts/verify_site.py --base-url http://127.0.0.1:8765/ --output-dir verification/all-pages
          python scripts/verify_home_layout.py --base-url http://127.0.0.1:8765/ --output-dir verification/home-layout
      - name: Save validated changes on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/css/home-responsive.css BUILD.json .github/workflows/site.yml scripts/verify_home_layout.py
          git rm .github/workflows/prepare-home-layout.yml
          git commit -m 'Apply verified homepage proportions without altering approved content or other pages'
          git push origin HEAD:enhancement/home-large-screen-20260928
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-layout-review
          path: verification/
          retention-days: 14
