name: Prepare full Solutions layout
on:
  push:
    branches: [enhancement/solutions-full-layout-20260928]
    paths: [.github/workflows/prepare-solutions-layout.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install existing verification tools
        run: python -m pip install -r requirements-dev.txt
      - name: Connect the page-specific stylesheet without changing content
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import hashlib,json,subprocess
          page=Path('workforce-solutions.html');before=page.read_text();manifest=json.loads(Path('BUILD.json').read_text())
          assert manifest['repository']=='pks-alt/Medlivo-Website-Final'
          assert hashlib.sha256(page.read_bytes()).hexdigest()==manifest['files']['workforce-solutions.html']
          assert 'solutions-responsive.css' not in before
          old='<link rel="stylesheet" href="assets/css/workforce-solutions.css?v=solutions-panel-20260928">'
          assert before.count(old)==1
          after=before.replace(old,old+'\n<link rel="stylesheet" href="assets/css/solutions-responsive.css?v=20260928-full">')
          assert BeautifulSoup(before,'html.parser').body.decode()==BeautifulSoup(after,'html.parser').body.decode()
          page.write_text(after)
          for name,sha in manifest['files'].items():
              if name!='workforce-solutions.html':assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha,name+' changed'
          subprocess.run(['python','scripts/update_manifest.py','--build-id','medlivo-final-solutions-responsive-20260928'],check=True)
          Path('verification').mkdir(exist_ok=True)
          Path('verification/scope.json').write_text(json.dumps({'solutions_body_unchanged':True,'other_ten_pages_and_existing_assets_unchanged':True,'only_new_style_applies_to':'workforce-solutions.html'},indent=2))
          PY
      - name: Verify all pages and full Solutions layout
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/solutions-server.log 2>&1 &
          python scripts/verify_site.py --base-url http://127.0.0.1:8765/ --output-dir verification/all-pages
          python scripts/verify_solutions_layout.py --base-url http://127.0.0.1:8765/ --output-dir verification/solutions
      - name: Commit only tested source changes on this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workforce-solutions.html BUILD.json
          git commit -m 'Apply full Solutions layout refinement with approved content unchanged'
          git push origin HEAD:enhancement/solutions-full-layout-20260928
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solutions-full-review
          path: verification/
          retention-days: 14
