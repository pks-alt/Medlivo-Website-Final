name: Check published Locum specialty directory
on:
  push:
    branches: [enhancement/locum-specialty-directory]
    paths: [.github/workflows/check-published-specialty-directory.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d46e661abc69a99a1cb4e5b1a59dde6485339892
      - name: Install existing browser tools
        run: python -m pip install -r requirements-dev.txt
      - name: Wait for the exact published HTML and stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request,hashlib,time
          base='https://pks-alt.github.io/Medlivo-Website-Final/'
          for name in ['locum-tenens.html','assets/css/locum-responsive.css']:
              expected=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              for attempt in range(12):
                  try:
                      req=urllib.request.Request(base+name,headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=35) as r:data=r.read()
                      if hashlib.sha256(data).hexdigest()==expected:break
                  except Exception as e:print(str(e))
                  time.sleep(10)
              else:raise SystemExit('Published version mismatch: '+name)
          print('Public HTML and CSS match the tested commit.')
          PY
      - name: Verify public desktop and mobile layouts and routes
        run: python scripts/verify_locum_layout.py --base-url https://pks-alt.github.io/Medlivo-Website-Final/ --public --output-dir verification/locum-public
      - name: Preserve public screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locum-directory-public-verification
          path: verification/locum-public/
          retention-days: 14
