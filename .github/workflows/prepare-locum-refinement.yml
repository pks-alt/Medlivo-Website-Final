name: Verify approved Locum refinements
on:
  push:
    branches: [enhancement/locum-reference-refinement-final]
    paths: [.github/workflows/prepare-locum-refinement.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhancement/locum-reference-refinement-final
      - name: Install existing verification tools
        run: python -m pip install -r requirements-dev.txt
      - name: Apply the exact approved four-file package
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib,json,hashlib,os
          from bs4 import BeautifulSoup
          assert os.environ['GITHUB_REPOSITORY']=='pks-alt/Medlivo-Website-Final'
          encoded='';
          # The compact transport is checked before any repository file is changed.
          raw=zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest()=='d002862e764e8e048215a5375ca726f9b108571f72f7848104f88c04ea2f4ab3','Package transport mismatch'
          edits=json.loads(raw)
          allowed={'locum-tenens.html','assets/css/locum-responsive.css','scripts/verify_locum_layout.py','BUILD.json'}
          assert set(edits)==allowed
          baseline=json.loads(Path('BUILD.json').read_text())
          original=BeautifulSoup(Path('locum-tenens.html').read_text(),'html.parser')
          for name,item in edits.items():
              before=Path(name).read_text(encoding='utf-8')
              assert hashlib.sha256(before.encode()).hexdigest()==item['before'],'Starting file differs: '+name
              after=before
              for change in reversed(item['edits']):after=after[:change['start']]+change['text']+after[change['end']:]
              assert hashlib.sha256(after.encode()).hexdigest()==item['after'],'Output mismatch: '+name
              Path(name).write_text(after,encoding='utf-8')
          new=BeautifulSoup(Path('locum-tenens.html').read_text(),'html.parser')
          for selector in ['header','footer','#care-settings','.ld-hero-photo','#engage']:
              assert str(original.select_one(selector))==str(new.select_one(selector)),selector+' changed'
          assert len(new.select('main > section'))==8
          assert [a.get('href') for a in original.select('a')]==[a.get('href') for a in new.select('a')]
          for name,digest in baseline['files'].items():
              if name not in allowed:assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,'Unrelated file changed: '+name
          out=Path('verification/locum-refinement');out.mkdir(parents=True,exist_ok=True)
          (out/'scope.json').write_text(json.dumps({'source_commit':'7665edec6629e602de5efdbc2171a5869a2fd73d','package_sha256':hashlib.sha256(raw).hexdigest(),'changed_files':sorted(allowed),'eight_sections_preserved':True,'four_settings_and_routes_preserved':True,'other_pages_and_image_bytes_unchanged':True,'output_hashes':{k:v['after'] for k,v in edits.items()}},indent=2))
          PY
      - name: Test all pages and Locum desktop and mobile rendering
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/medlivo-locum-http.log 2>&1 &
          python scripts/verify_site.py --base-url http://127.0.0.1:8765/ --output-dir verification/locum-refinement/all
          python scripts/verify_locum_layout.py --base-url http://127.0.0.1:8765/ --output-dir verification/locum-refinement/locum
      - name: Save verified source on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --exit-code -- .github/workflows/site.yml
          git add locum-tenens.html assets/css/locum-responsive.css scripts/verify_locum_layout.py BUILD.json
          git commit -m 'Finalize approved Locum specialties and provider-support messaging'
          git push origin HEAD:enhancement/locum-reference-refinement-final
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locum-refinement-review
          path: verification/locum-refinement/
          retention-days: 14
