name: Verify approved Locum refinements
on:
  push:
    branches: [enhancement/locum-reference-refinement-final]
    paths: [.github/workflows/prepare-locum-refinement.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhancement/locum-reference-refinement-final
      - name: Install existing verification tools
        run: python -m pip install -r requirements-dev.txt
      - name: Apply the exact approved four-file package
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,os
          from bs4 import BeautifulSoup
          assert os.environ['GITHUB_REPOSITORY']=='pks-alt/Medlivo-Website-Final'
          expected={
           'locum-tenens.html':'d16a52e007793ab21b6c95feabd41b2e2b5952aeb371b7079c715c2421547181',
           'assets/css/locum-responsive.css':'17c7b839bb69b2dac4b4652507126bc9fc5fb1b9998f2d8e98eef5f51f5907e9',
           'scripts/verify_locum_layout.py':'b39103038256acd8c523a1f445b3dd4d3fd44c02ff333e09f4cefc0095ab92bd',
           'BUILD.json':'55e6e12d6667001ecd59b48c895da74af3ac88d17e98d2b8aa364d5554fa97a1'
          }
          baseline=json.loads(Path('BUILD.json').read_text())
          html=Path('locum-tenens.html').read_text()
          assert hashlib.sha256(html.encode()).hexdigest()=='d9ab7146ea5de19a1d8804de2fd583000f54faf2a9acbc32e7a0ce4c037301d9'
          original=BeautifulSoup(html,'html.parser')
          replacements=[
           ('assets/css/locum-responsive.css?v=20260928-final','assets/css/locum-responsive.css?v=20260928-specialty-review'),
           ('Medlivo connects healthcare organizations with physicians and advanced practice providers for per diem coverage, travel locum assignments and permanent, full-time roles.','Medlivo connects hospitals, clinics and health systems nationwide with physicians and advanced practice providers for per diem coverage, travel locum assignments and permanent, full-time roles.'),
           ('Support for individual shifts, weekends and recurring coverage needs. We match provider availability to the dates, schedule and clinical responsibilities your team needs covered.','Coverage for individual shifts, weekends, call schedules and recurring gaps, with local provider options where available.'),
           ('We establish what the organization needs and what the provider is looking for before presenting a candidate.','A dedicated contact coordinates the search, interviews and updates with your hiring team, including MSP and VMS program requirements.'),
           ('Support continues throughout locum assignments.','A point of contact for schedule changes, extensions and assignment questions.'),
           ('Explore per diem, travel locum and permanent opportunities by profession, specialty and location.','Choose the schedule and location that fit your goals. Review responsibilities, compensation and assignment support with a recruiter before you commit.')
          ]
          for before,after in replacements:
           assert html.count(before)==1,before
           html=html.replace(before,after)
          band='''    <div class="ld-specialty-band" aria-labelledby="locum-specialty-title">
                <h3 id="locum-specialty-title">Specialties we support</h3>
                <ul class="ld-specialty-list">
                  <li>Primary Care</li><li>Hospitalist Medicine</li><li>Emergency Medicine</li><li>Behavioral Health</li><li>Surgery</li><li>Critical Care</li><li>Urgent Care</li><li>Women’s Health</li><li>Cardiology</li><li>Orthopedics</li><li>Anesthesia</li>
                </ul>
              </div>
          '''
          at=html.index('\n<section class="ld-settings"')
          insert_at=html.rfind('  </div>\n</section>',0,at)
          assert insert_at>html.index('<section class="ld-providers"')
          html=html[:insert_at]+band+html[insert_at:]
          Path('locum-tenens.html').write_text(html,encoding='utf-8')
          css=Path('assets/css/locum-responsive.css').read_text()
          css+='''
          /* Compact specialty coverage within the provider section; no extra page section. */
          .ld-specialty-band{display:grid;grid-template-columns:minmax(180px,.8fr) minmax(0,3.2fr);gap:18px 30px;align-items:start;margin-top:27px;padding-top:22px;border-top:1px solid var(--ld-line)}
          .locum-division .ld-specialty-band h3{color:var(--ld-ink);font-size:18px;line-height:1.45;margin:0}
          .ld-specialty-list{display:flex;flex-wrap:wrap;gap:8px 24px;list-style:none;margin:0;padding:0;min-width:0}
          .ld-specialty-list li{position:relative;max-width:100%;padding-left:12px;color:var(--ld-body);font-size:16px;line-height:1.55;font-weight:500}
          .ld-specialty-list li::before{content:"";position:absolute;left:0;top:.65em;width:4px;height:4px;border-radius:50%;background:#21616b}
          @media(max-width:820px){.ld-specialty-band{grid-template-columns:1fr;gap:12px;margin-top:23px;padding-top:20px}.ld-specialty-list{gap:7px 20px}}
          @media(max-width:540px){.ld-specialty-list{column-gap:16px}.ld-specialty-list li{font-size:16px}}
          '''
          Path('assets/css/locum-responsive.css').write_text(css,encoding='utf-8')
          test=Path('scripts/verify_locum_layout.py').read_text()
          needle="main a.btn,.ld-role-tag')"
          assert test.count(needle)==1
          test=test.replace(needle,"main a.btn,.ld-role-tag,.ld-specialty-list li')")
          anchor="              'four_provider_groups':row['role_tags']==['MD / DO','NP','PA','CRNA'],\n"
          extra="""              'specialty_coverage':page.locator('.ld-specialty-list li').all_text_contents()==['Primary Care','Hospitalist Medicine','Emergency Medicine','Behavioral Health','Surgery','Critical Care','Urgent Care','Women’s Health','Cardiology','Orthopedics','Anesthesia'],
                        'ongoing_support': 'schedule changes, extensions and assignment questions' in page.locator('.ld-support-note').inner_text(),
                        'provider_clarity': 'before you commit' in page.locator('.ld-opportunities .ld-section-head').inner_text(),
                        'program_support': 'MSP and VMS' in page.locator('.ld-recruiting .ld-section-head').inner_text(),
          """
          assert test.count(anchor)==1
          test=test.replace(anchor,anchor+extra)
          Path('scripts/verify_locum_layout.py').write_text(test,encoding='utf-8')
          subprocess.run(['python','scripts/update_manifest.py','--build-id','medlivo-locum-specialty-review-20260928'],check=True)
          for name,digest in expected.items():
           actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
           assert actual==digest,(name,actual,digest)
          new=BeautifulSoup(html,'html.parser')
          for selector in ['header','footer','#care-settings','.ld-hero-photo','#engage']:
           assert str(original.select_one(selector))==str(new.select_one(selector)),selector
          assert len(new.select('main > section'))==8
          assert [a.get('href') for a in original.select('a')]==[a.get('href') for a in new.select('a')]
          for name,digest in baseline['files'].items():
           if name not in expected:assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          out=Path('verification/locum-refinement');out.mkdir(parents=True,exist_ok=True)
          report={'source_commit':'7665edec6629e602de5efdbc2171a5869a2fd73d','matches_approved_package':True,'eight_sections_preserved':True,'settings_and_routes_preserved':True,'other_pages_and_assets_unchanged':True,'output_hashes':expected}
          (out/'scope.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Test all pages and Locum desktop and mobile rendering
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/medlivo-locum-http.log 2>&1 &
          python scripts/verify_site.py --base-url http://127.0.0.1:8765/ --output-dir verification/locum-refinement/all
          python scripts/verify_locum_layout.py --base-url http://127.0.0.1:8765/ --output-dir verification/locum-refinement/locum
      - name: Save verified source on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --exit-code -- .github/workflows/site.yml
          git add locum-tenens.html assets/css/locum-responsive.css scripts/verify_locum_layout.py BUILD.json
          git commit -m 'Finalize approved Locum specialties and provider-support messaging'
          git push origin HEAD:enhancement/locum-reference-refinement-final
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locum-refinement-review
          path: verification/locum-refinement/
          retention-days: 14
