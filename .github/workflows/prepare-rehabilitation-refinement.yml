name: Prepare Rehabilitation refinement
on:
  push:
    branches: [enhancement/rehabilitation-refinement-20260928]
    paths: [.github/workflows/prepare-rehabilitation-refinement.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhancement/rehabilitation-refinement-20260928
      - name: Install existing verification tools
        run: python -m pip install -r requirements-dev.txt
      - name: Assemble the exact reviewed Rehabilitation source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,hashlib,base64,zlib,urllib.request,subprocess,re
          from bs4 import BeautifulSoup
          repo=os.environ['GITHUB_REPOSITORY']
          assert repo=='pks-alt/Medlivo-Website-Final'
          original=Path('rehabilitation.html').read_text()
          baseline=json.loads(Path('BUILD.json').read_text())
          digest=lambda data:hashlib.sha256(data).hexdigest()
          assert digest(original.encode())==baseline['files']['rehabilitation.html']
          ids=['df5f51e2fbcd0045ceaeed953519c213c9523ab7','a9b9ac555f1fffcd735e8f4918bff58d3c0d8db5','9141c954f33b07f5c65c80cd12acae4636727b19','edd7471f2f06e7b282efe2c9158ca94c471d40b5','3089cd814f7b69a861273c774a6c3a0516d8e4f2']
          parts=[]
          for sha in ids:
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response:blob=json.load(response)
              assert blob['sha']==sha
              parts.append(base64.b64decode(blob['content']).decode())
          raw=zlib.decompress(base64.b64decode(''.join(parts)))
          assert digest(raw)=='5999d755d8ced68b14a838c774c0047bb3902771ae91d732a3e9e9e574306a47','Candidate transport mismatch'
          files=json.loads(raw)
          assert set(files)=={'rehabilitation.html','assets/css/rehab-responsive.css','scripts/verify_rehab_layout.py'}
          for name,content in files.items():
              path=Path(name);path.parent.mkdir(parents=True,exist_ok=True);path.write_text(content,encoding='utf-8')
          old=BeautifulSoup(original,'html.parser');new=BeautifulSoup(files['rehabilitation.html'],'html.parser')
          for name in ['header','footer']:assert str(old.select_one(name))==str(new.select_one(name)),name+' changed'
          assert old.select_one('.therapist-proof-copy p').get_text()==new.select_one('.rd-proof-copy p').get_text()
          assert old.select_one('.therapist-proof-copy h2').get_text()==new.select_one('.rd-proof-copy h2').get_text()
          oldrows=old.select('.setting-card');newrows=new.select('.setting-card');assert len(oldrows)==len(newrows)==4
          for a,b in zip(oldrows,newrows):
              assert a.h3.get_text()==b.h3.get_text()
              assert a.select_one(':scope > p').get_text()==b.select_one('.rd-setting-copy p').get_text()
              assert a.select_one('.setting-matters strong').get_text()==b.select_one('.rd-setting-factors p').get_text()
          for a,b in zip(old.select('.rehab-position-card'),new.select('.rd-opportunity-card')):
              assert a.p.get_text()==b.p.get_text()
              assert a.a['href']==b.a['href']
          for name,expected in baseline['files'].items():
              if name!='rehabilitation.html':assert digest(Path(name).read_bytes())==expected,'Unexpected change: '+name
          wf=Path('.github/workflows/site.yml');content=wf.read_text()
          local='          python scripts/verify_nursing_layout.py --base-url http://127.0.0.1:8765/ --output-dir verification/nursing-local'
          public='          python scripts/verify_nursing_layout.py --base-url "$SITE_URL" --public --output-dir verification/nursing-public'
          assert content.count(local)==content.count(public)==1
          content=content.replace(local,local+'\n          python scripts/verify_rehab_layout.py --base-url http://127.0.0.1:8765/ --output-dir verification/rehab-local')
          content=content.replace(public,public+'\n          python scripts/verify_rehab_layout.py --base-url "$SITE_URL" --public --output-dir verification/rehab-public')
          wf.write_text(content)
          subprocess.run(['python','scripts/update_manifest.py','--build-id','medlivo-rehabilitation-refined-20260928'],check=True)
          report={'source_commit':'94ff9604297cc91e79ce3a33f74a569cd6b03960','candidate_sha256':digest(raw),'founder_story_preserved':True,'four_settings_preserved':True,'other_page_and_image_bytes_unchanged':True,'main_words_before':len(old.main.get_text(' ',strip=True).split()),'main_words_after':len(new.main.get_text(' ',strip=True).split()),'files':{k:digest(v.encode()) for k,v in files.items()}}
          out=Path('verification/rehab-prep');out.mkdir(parents=True,exist_ok=True);(out/'scope.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          PY
      - name: Check all pages and fifteen Rehabilitation screen sizes
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/medlivo-rehab-http.log 2>&1 &
          python scripts/verify_site.py --base-url http://127.0.0.1:8765/ --output-dir verification/rehab-prep/all
          python scripts/verify_rehab_layout.py --base-url http://127.0.0.1:8765/ --output-dir verification/rehab-prep/rehab
      - name: Preserve tested source and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-rehabilitation-refinement.yml
          git add rehabilitation.html assets/css/rehab-responsive.css scripts/verify_rehab_layout.py BUILD.json .github/workflows/site.yml
          git commit -m 'Refine Rehabilitation with clear therapy messaging and compact readable layouts'
          git push origin HEAD:enhancement/rehabilitation-refinement-20260928
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rehab-refinement-review
          path: verification/rehab-prep/
          retention-days: 14
