name: Verify standalone Medlivo website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [pages build and deployment]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: read
concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install browser verification tools
        run: python -m pip install -r requirements-dev.txt
      - name: Verify the independent root build
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/medlivo-http.log 2>&1 &
          python scripts/verify_site.py --base-url http://127.0.0.1:8765/ --output-dir verification/local
          python scripts/verify_home_layout.py --base-url http://127.0.0.1:8765/ --output-dir verification/home-local
          python scripts/verify_solutions_layout.py --base-url http://127.0.0.1:8765/ --output-dir verification/solutions-local
          python scripts/verify_specialties_layout.py --base-url http://127.0.0.1:8765/ --output-dir verification/specialties-local
      - name: Package only deployable site files
        run: |
          python - <<'PY'
          import json,pathlib,shutil
          root=pathlib.Path('.');manifest=json.loads((root/'BUILD.json').read_text());out=root/'_site'
          for name in list(manifest['files'])+['BUILD.json','.nojekyll']:
              target=out/name;target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(root/name,target)
          print('Packaged',len(manifest['pages']),'pages with their local assets.')
          PY
      - name: Save the standalone website build
        uses: actions/upload-artifact@v4
        with:
          name: medlivo-final-build
          path: _site/
          include-hidden-files: true
          retention-days: 14
      - name: Check whether GitHub Pages is enabled
        id: pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,json,os,pathlib
          request=urllib.request.Request('https://api.github.com/repos/'+os.environ['REPO']+'/pages',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          enabled=False;url='';info={}
          try:
              with urllib.request.urlopen(request,timeout=30) as r:info=json.load(r)
              enabled=True;url=info.get('html_url','')
              if info.get('build_type')!='legacy' or info.get('source',{}).get('branch')!='main' or info.get('source',{}).get('path')!='/':
                  raise SystemExit('Pages must use only main / (root), not a second custom publisher.')
          except urllib.error.HTTPError as error:
              if error.code==404:info={'enabled':False,'action':'Enable Settings > Pages > Deploy from a branch > main > / (root)'}
              else:raise
          pathlib.Path('verification/publishing-status.json').write_text(json.dumps({'enabled':enabled,'url':url,'build_type':info.get('build_type'),'source':info.get('source'),'action':info.get('action')},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('enabled='+str(enabled).lower()+'\nurl='+url+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Publishing status\n'+('Pages is enabled. Public content will be checked below.\n' if enabled else 'The standalone code and browser checks are ready. GitHub Pages is not enabled yet. Select Deploy from a branch, main, / (root) in repository Pages settings.\n'))
          PY
      - name: Verify public content and browser rendering
        if: steps.pages.outputs.enabled == 'true'
        env:
          SITE_URL: ${{ steps.pages.outputs.url }}
        run: |
          python scripts/verify_site.py --base-url "$SITE_URL" --public --output-dir verification/public
          python scripts/verify_home_layout.py --base-url "$SITE_URL" --output-dir verification/home-public
          python scripts/verify_solutions_layout.py --base-url "$SITE_URL" --public --output-dir verification/solutions-public
          python scripts/verify_specialties_layout.py --base-url "$SITE_URL" --public --output-dir verification/specialties-public
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-verification
          path: verification/
          retention-days: 14
